name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: library_test
          POSTGRES_USER: library
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library -d library_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://library:ci-ephemeral-password@localhost:5432/library_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: docker build .
